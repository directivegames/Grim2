<article class="store-card" data-store-card>
  <div class="store-card-art" data-store-card-art data-kind="permanent">
    <span class="store-card-chip store-card-chip-type" data-store-card-type>Permanent</span>
    <span class="store-card-chip store-card-chip-draft" data-store-card-draft hidden>Draft</span>
    <span class="store-card-chip store-card-chip-count" data-store-card-count hidden></span>
    <span class="store-card-picture" data-store-card-picture aria-hidden="true"></span>
    <span class="store-card-watermark" aria-hidden="true">Draft</span>
  </div>
  <h3 class="store-card-name" data-store-card-name></h3>
  <p class="store-card-description" data-store-card-description></p>
  <div class="store-card-price">
    <span class="store-card-amount" data-store-card-amount></span>
    <span class="store-card-note" data-store-card-note></span>
  </div>
  <div class="store-card-action" data-store-card-action-slot></div>
</article>
